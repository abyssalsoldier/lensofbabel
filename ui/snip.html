<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select text on screen</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: transparent; }
    body {
      margin: 0; cursor: crosshair; user-select: none;
      background: rgba(0, 0, 0, 0.32);
    }
    /* While dragging, the box's huge shadow dims everything around it. */
    body.dragging { background: transparent; }
    .box {
      position: fixed; display: none; border: 1.5px solid #5b92f0;
      box-shadow: 0 0 0 200vmax rgba(0, 0, 0, 0.32);
    }
    body.dragging .box { display: block; }
    .hint {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 22, 26, 0.88); color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 13px; pointer-events: none; white-space: nowrap;
    }
    body.dragging .hint { display: none; }
  </style>
</head>
<body>
  <div class="hint">Drag a box around the text to translate · Esc to cancel</div>
  <div class="box" id="box"></div>
  <script src="snip.js"></script>
</body>
</html>
